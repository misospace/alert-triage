name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check Go version consistency
        run: |
          mod_version="$(sed -nE 's/^go[[:space:]]+([0-9]+[.][0-9]+)([.][0-9]+)?([[:space:]]|$).*/\1/p' go.mod)"
          docker_version="$(sed -nE 's|^FROM[[:space:]]+docker[.]io/library/golang:([0-9]+[.][0-9]+)([.][0-9]+)?-.*|\1|p' Dockerfile)"
          if [ -z "$mod_version" ]; then
            echo "::error::go.mod has no go directive"
            exit 1
          fi
          if [ -z "$docker_version" ]; then
            echo "::error::Dockerfile has no golang builder FROM line"
            exit 1
          fi
          if [ "$mod_version" != "$docker_version" ]; then
            echo "::error::Go version mismatch: go.mod=$mod_version Dockerfile=$docker_version"
            exit 1
          fi
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
